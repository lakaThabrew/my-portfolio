name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - master      # triggers on master branch
  workflow_dispatch:  # you can manually run this too

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # If you're using Node.js (React/Vite/Angular/Vue)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build the site
        run: npm run build   # Adjust if your build script is different

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build   # Change to ./dist if your build outputs there
