name: Fetch Medium Blogs

on:
  schedule:
    - cron: '0 0 1,15 * *' # Runs at midnight on the 1st and 15th of every month (Bi-weekly)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-blogs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch Blogs into JSON
        run: node scripts/fetch-blogs.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/blogs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update medium blogs data" && git push)
