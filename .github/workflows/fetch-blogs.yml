name: Fetch Medium Blogs

on:
  schedule:
    - cron: '17 0 1,15 * *'
  workflow_dispatch:

jobs:
  update-blogs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch blogs into JSON
        run: node scripts/fetch-blogs.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/blogs.json
          git diff --cached --quiet || git commit -m "chore: auto-update medium blogs data"
          git diff --cached --quiet || git push
