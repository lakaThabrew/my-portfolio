name: Weekly Repo Status
run-name: Weekly Repo Status (#${{ github.run_number }})

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: weekly-repo-status
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate upbeat weekly report issue
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const now = new Date();
            const since = new Date(now);
            since.setUTCDate(since.getUTCDate() - 7);

            const ymd = now.toISOString().slice(0, 10);
            const sinceDate = since.toISOString().slice(0, 10);

            // Retry helper to avoid API transient errors
            const retry = async (fn, retries = 2) => {
              let lastError;
              for (let i = 0; i <= retries; i += 1) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  if (i === retries) break;
                  await new Promise((resolve) => setTimeout(resolve, 1500 * (i + 1)));
                }
              }
              throw lastError;
            };

            const query = async (q) => {
              const result = await retry(() => github.rest.search.issuesAndPullRequests({ q }));
              return result.data.total_count || 0;
            };

            const createdIssues = await query(`repo:${owner}/${repo} is:issue created:>=${sinceDate}`);
            const closedIssues = await query(`repo:${owner}/${repo} is:issue is:closed closed:>=${sinceDate}`);
            const openedPRs = await query(`repo:${owner}/${repo} is:pr created:>=${sinceDate}`);
            const mergedPRs = await query(`repo:${owner}/${repo} is:pr merged:>=${sinceDate}`);
            const openIssues = await query(`repo:${owner}/${repo} is:issue is:open`);
            const openPRs = await query(`repo:${owner}/${repo} is:pr is:open`);

            let latestRelease = "No release published yet.";
            try {
              const release = await github.rest.repos.getLatestRelease({ owner, repo });
              latestRelease = `[${release.data.tag_name}](${release.data.html_url}) - ${release.data.name || "Latest release"}`;
            } catch (error) {
              if (error.status !== 404) core.info(`Could not fetch latest release: ${error.message}`);
            }

            const title = `Weekly Repo Status ✨ - ${ymd}`;
            
            // Format highly upbeat, matching the generative workflow's .md description!
            const body = [
              `# 🌟 Weekly Repo Status (${ymd}) 🌟`,
              "",
              `Hello amazing team! 👋 Here's your high-energy recap for **${sinceDate}** to **${ymd}**. Great work on the repository this week! Let's review our progress.`,
              "",
              "## 🚀 Activity (Last 7 Days)",
              `- 🔥 **New issues opened:** ${createdIssues}`,
              `- 🎉 **Issues closed:** ${closedIssues}`,
              `- ⚡ **Pull requests opened:** ${openedPRs}`,
              `- 🚢 **Pull requests merged:** ${mergedPRs}`,
              "",
              "What a fantastic week! Keep the momentum going! 💪",
              "",
              "## 📌 Current Backlog",
              `- 📝 **Open issues:** ${openIssues}`,
              `- 🔄 **Open pull requests:** ${openPRs}`,
              "",
              "Let's tackle this backlog together! Collaboration makes the dream work! 🤝",
              "",
              "## 📦 Latest Release",
              `- 🎁 ${latestRelease}`,
              "",
              "## 🎯 Actionable Next Steps",
              "1. **Triage newly opened issues:** Let's clarify goals and set priorities for the week! 📋",
              "2. **Review open PRs:** Help unblock community contributions and merge great awesome code! ✅",
              "3. **Plan the next milestone:** Focus on what we can achieve this week! 🎯",
              "",
              "Stay positive and keep building amazing things! ✨"
            ].join("\n");

            const labelName = "weekly-status";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status === 404) {
                await retry(() =>
                  github.rest.issues.createLabel({
                    owner, repo,
                    name: labelName,
                    color: "1D76DB",
                    description: "Automated weekly repository status report"
                  })
                );
              } else throw error;
            }

            // Find existing issues and replace/create
            const openWeeklyIssues = await retry(() =>
              github.paginate(github.rest.issues.listForRepo, {
                owner, repo,
                state: "open",
                labels: labelName,
                per_page: 100,
              })
            );

            const statusIssues = openWeeklyIssues.filter(
              (issue) => !issue.pull_request && issue.title.startsWith("Weekly Repo Status")
            );

            const currentIssue = statusIssues.find((issue) => issue.title === title);
            let issueNumber, issueUrl;

            if (currentIssue) {
              const updated = await retry(() =>
                github.rest.issues.update({ owner, repo, issue_number: currentIssue.number, body })
              );
              issueNumber = updated.data.number;
              issueUrl = updated.data.html_url;
              core.info(`Updated existing upbeat issue: #${issueNumber}`);
            } else {
              const created = await retry(() =>
                github.rest.issues.create({ owner, repo, title, body, labels: [labelName] })
              );
              issueNumber = created.data.number;
              issueUrl = created.data.html_url;
              core.info(`Created upbeat issue: #${issueNumber}`);
            }

            // Closes old status issues
            const staleIssues = statusIssues.filter((issue) => issue.number !== issueNumber);
            for (const staleIssue of staleIssues) {
              await retry(() =>
                github.rest.issues.update({ owner, repo, issue_number: staleIssue.number, state: "closed" })
              );
            }

            await core.summary
              .addHeading("Weekly Repo Status")
              .addRaw(`Issue: #${issueNumber} (${issueUrl})`).addEOL()
              .addRaw(`Closed stale status issues: ${staleIssues.length}`).addEOL()
              .write();
